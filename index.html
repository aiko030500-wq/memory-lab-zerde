<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sound or Picture? | Memory Lab</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(145deg,#edf4ff,#e9e4ff);
color:#24335b;
min-height:100vh;
}
header{
background:linear-gradient(110deg,#2465d9,#793ee5);
color:white;
padding:25px 15px;
text-align:center;
}
header h1{font-size:27px;margin:8px 0}
header p{font-size:14px}
.logo{font-size:48px}
main{max-width:650px;margin:auto;padding:15px}
.card{
background:white;
border-radius:22px;
padding:23px;
margin:15px 0;
box-shadow:0 7px 24px #354b8620;
text-align:center;
}
h2{color:#4256b6}
button{
border:0;
border-radius:14px;
padding:15px 22px;
background:linear-gradient(110deg,#326be8,#8051e8);
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin:7px;
}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{
width:100%;
padding:15px;
font-size:17px;
border:2px solid #d5def5;
border-radius:12px;
margin:9px 0;
}
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}
.mode{
padding:18px 8px;
border-radius:16px;
background:#eef2ff;
font-weight:bold;
}
.word{
font-size:36px;
font-weight:bold;
color:#315fd5;
margin:25px 0;
}
.picture{font-size:90px;margin:20px}
.progress{
background:#e5eafa;
border-radius:20px;
height:12px;
overflow:hidden;
margin:15px 0;
}
.bar{
height:100%;
background:linear-gradient(90deg,#3987ff,#9555ed);
width:0%;
transition:.3s;
}
.small{font-size:13px;color:#64718d}
.result{
padding:13px;
border-radius:12px;
background:#f0f4ff;
margin:9px 0;
text-align:left;
}
.hidden{display:none}
footer{text-align:center;padding:25px;color:#65718d}
</style>
</head>

<body>

<header>
<div class="logo">🧠</div>
<h1>SOUND OR PICTURE?</h1>
<p>HOW DOES THE BRAIN REMEMBER ENGLISH WORDS?</p>
<h3>MEMORY LAB</h3>
<p>Interactive Research Experiment • ZERDE 2026–2027</p>
</header>

<main id="app"></main>

<footer>
Sound or Picture? — Memory Lab<br>
Scientific Research Project «ZERDE»
</footer>

<script>
const words=[
["bridge","мост","🌉"],
["feather","перо","🪶"],
["mirror","зеркало","🪞"],
["compass","компас","🧭"],
["squirrel","белка","🐿️"],
["lantern","фонарь","🏮"],
["umbrella","зонт","☂️"],
["tunnel","туннель","🚇"],
["anchor","якорь","⚓"],
["owl","сова","🦉"],
["island","остров","🏝️"],
["ladder","лестница","🪜"],
["candle","свеча","🕯️"],
["shell","ракушка","🐚"],
["glove","перчатка","🧤"],
["castle","замок","🏰"],
["whale","кит","🐋"],
["basket","корзина","🧺"],
["rocket","ракета","🚀"],
["pillow","подушка","🛏️"],
["key","ключ","🔑"],
["mountain","гора","⛰️"],
["cloud","облако","☁️"],
["bicycle","велосипед","🚲"]
];

const modes=["TEXT","SOUND","PICTURE","BOTH"];
const icons=["📝","🔊","🖼️","✨"];
const app=document.getElementById("app");
const storageKey="zerde_memory_lab_v1";

let data={
id:"",
variant:0,
stage:"home",
index:0,
pre:{},
immediate:{},
delayed:{},
completedAt:null,
learningStartedAt:null
};

try{
let saved=JSON.parse(localStorage.getItem(storageKey));
if(saved && saved.stage)data=saved;
}catch(e){}

function save(){
localStorage.setItem(storageKey,JSON.stringify(data));
}

function box(content){
app.innerHTML='<div class="card">'+content+'</div>';
}

function progress(i,total){
return `<div class="progress">
<div class="bar" style="width:${i/total*100}%"></div>
</div>
<p class="small">${i} / ${total}</p>`;
}

function condition(i){
return modes[(i+Number(data.variant))%4];
}

function home(){
data.stage="home";
save();
box(`
<h2>Welcome to Memory Lab!</h2>
<p>Discover how your brain remembers English words.</p>
<div class="grid">
<div class="mode">📝<br>TEXT</div>
<div class="mode">🔊<br>SOUND</div>
<div class="mode">🖼️<br>PICTURE</div>
<div class="mode">✨<br>BOTH</div>
</div>
<p>24 words • 4 learning methods • 3 memory tests</p>
<button onclick="setup()">START EXPERIMENT →</button>
<p class="small">Your answers are stored on this device.</p>
`);
}

function setup(){
box(`
<h2>Participant Setup</h2>
<p>Enter an anonymous participant code.</p>
<input id="pid" placeholder="Example: P01" maxlength="20">
<p>Experiment variant</p>
<select id="variant">
<option value="0">Variant 0</option>
<option value="1">Variant 1</option>
<option value="2">Variant 2</option>
<option value="3">Variant 3</option>
</select>
<button onclick="begin()">BEGIN TEST →</button>
<p class="small">Do not enter your real name.</p>
`);
}

function begin(){
let id=document.getElementById("pid").value.trim();
if(!/^[a-zA-Z0-9_-]{2,20}$/.test(id)){
alert("Enter an anonymous code, for example P01.");
return;
}
data={
id:id,
variant:Number(document.getElementById("variant").value),
stage:"pre",
index:0,
pre:{},
immediate:{},
delayed:{},
completedAt:null,
learningStartedAt:null
};
save();
render();
}

function answerKey(s){
return s.toLowerCase().trim()
.replace(/ё/g,"е")
.replace(/\s+/g," ");
}

function correct(i,answer){
let accepted=[words[i][1]];
if(i===6)accepted.push("зонтик");
if(i===7)accepted.push("тоннель");
if(i===13)accepted.push("раковина");
return accepted.some(x=>answerKey(x)===answerKey(answer));
}

function render(){
if(data.stage==="home"){home();return;}
if(data.stage==="pre" ||
data.stage==="immediate" ||
data.stage==="delayed"){
test();
return;
}
if(data.stage==="learn"){learn();return;}
if(data.stage==="waiting"){waiting();return;}
if(data.stage==="done"){results();return;}
}

function test(){
let labels={
pre:"PRE-TEST",
immediate:"IMMEDIATE TEST",
delayed:"24-HOUR TEST"
};

let i=data.index;
if(i>=24){
finishStage();
return;
}

box(`
<h2>${labels[data.stage]}</h2>
<p>Translate the English word into Russian.</p>
${progress(i+1,24)}
<div class="word">${words[i][0]}</div>
<input id="answer" placeholder="Русский перевод"
autocomplete="off">
<button onclick="submitAnswer()">NEXT →</button>
<button onclick="skip()">SKIP</button>
<p class="small">No pictures or sound during testing.</p>
`);
}

function submitAnswer(){
let value=document.getElementById("answer").value;
storeAnswer(value);
}

function skip(){
storeAnswer("");
}

function storeAnswer(value){
let i=data.index;
data[data.stage][i]=value;
data.index++;
save();
render();
}

function finishStage(){
if(data.stage==="pre"){
data.stage="learn";
data.index=0;
data.learningStartedAt=Date.now();
}
else if(data.stage==="immediate"){
data.stage="waiting";
data.index=0;
data.completedAt=Date.now();
}
else if(data.stage==="delayed"){
data.stage="done";
data.index=0;
}
save();
render();
}

function speak(word){
if(!("speechSynthesis" in window)){
alert("Speech is not supported on this device.");
return;
}
speechSynthesis.cancel();
let u=new SpeechSynthesisUtterance(word);
u.lang="en-US";
u.rate=.85;
speechSynthesis.speak(u);
}

function learn(){
let i=data.index;
if(i>=24){
finishStage();
return;
}

let w=words[i];
let mode=condition(i);
let visual=mode==="PICTURE" || mode==="BOTH";
let audio=mode==="SOUND" || mode==="BOTH";

box(`
<h2>LEARNING PHASE</h2>
${progress(i+1,24)}
<p>${icons[modes.indexOf(mode)]} ${mode} MODE</p>
${visual?`<div class="picture">${w[2]}</div>`:""}
<div class="word">${w[0]}</div>
<h2>${w[1]}</h2>
${audio?`<button onclick="speak('${w[0]}')">🔊 LISTEN</button>`:""}
<p class="small">Study this word for approximately 7 seconds.</p>
<button id="next" onclick="nextLearn()" disabled>
NEXT WORD →
</button>
<p class="small">The next button unlocks after 7 seconds.</p>
`);

setTimeout(()=>{
let b=document.getElementById("next");
if(b)b.disabled=false;
},7000);

if(audio)speak(w[0]);
}

function nextLearn(){
data.index++;
save();
render();
}

function waiting(){
let remaining=24*60*60*1000-
(Date.now()-data.completedAt);

let ready=remaining<=0;
let hours=Math.max(0,Math.ceil(remaining/3600000));

box(`
<h2>IMMEDIATE TEST COMPLETE!</h2>
<p>Your answers have been saved.</p>
<h3>Return after 24 hours</h3>
<p>${ready?
"The delayed test is now available.":
"Approximately "+hours+" hour(s) remaining."}</p>
<button onclick="results()">📊 VIEW RESULTS</button>
<button onclick="exportCSV()">💾 EXPORT CSV</button>
${ready?
`<button onclick="startDelayed()">START 24-HOUR TEST</button>`:
`<button onclick="render()">CHECK AGAIN</button>`}
<p class="small">
Use the same browser and device for the delayed test.
</p>
`);
}

function startDelayed(){
if(Date.now()-data.completedAt<86400000){
alert("Please wait 24 hours.");
return;
}
data.stage="delayed";
data.index=0;
save();
render();
}

function score(stage,mode){
let total=0;
for(let i=0;i<24;i++){
if(condition(i)!==mode)continue;
if(!Object.prototype.hasOwnProperty.call(data[stage],i))
continue;
if(correct(i,data[stage][i]))total++;
}
return total;
}

function results(){
let html=`
<h2>📊 MEMORY LAB RESULTS</h2>
<p>Participant: ${escapeHTML(data.id)}</p>
<p>Variant: ${data.variant}</p>
`;

for(let m of modes){
let a=score("pre",m);
let b=score("immediate",m);
let c=score("delayed",m);
let delayedDone=data.stage==="done";

html+=`
<div class="result">
<b>${icons[modes.indexOf(m)]} ${m}</b><br>
Before learning: ${a}/6<br>
Immediately after: ${b}/6<br>
After 24 hours: ${delayedDone?c+"/6":"Pending"}<br>
Immediate gain: ${b-a}
${delayedDone?`<br>24-hour gain: ${c-a}`:""}
</div>`;
}

html+=`
<button onclick="exportCSV()">💾 EXPORT CSV</button>
<button onclick="render()">CONTINUE</button>
<p class="small">
Results describe translation recall, not general intelligence.
</p>
`;

box(html);
}

function escapeHTML(s){
return String(s).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"
}[c]));
}

function csvCell(x){
return '"'+String(x??"").replace(/"/g,'""')+'"';
}

function exportCSV(){
let rows=[[
"participant","variant","word","condition",
"pre_answer","pre_correct",
"immediate_answer","immediate_correct",
"delayed_answer","delayed_correct"
]];

for(let i=0;i<24;i++){
let pre=data.pre[i];
let imm=data.immediate[i];
let del=data.delayed[i];

rows.push([
data.id,data.variant,words[i][0],condition(i),
pre??"",pre===undefined?"":Number(correct(i,pre)),
imm??"",imm===undefined?"":Number(correct(i,imm)),
del??"",del===undefined?"":Number(correct(i,del))
]);
}

let csv="\uFEFF"+rows.map(r=>
r.map(csvCell).join(",")).join("\r\n");

let blob=new Blob([csv],{
type:"text/csv;charset=utf-8"
});
let url=URL.createObjectURL(blob);
let a=document.createElement("a");
a.href=url;
a.download="Memory_Lab_"+data.id+".csv";
document.body.appendChild(a);
a.click();
a.remove();
setTimeout(()=>URL.revokeObjectURL(url),1000);
}

if(data.stage==="home")home();
else render();
</script>

</body>
</html>
